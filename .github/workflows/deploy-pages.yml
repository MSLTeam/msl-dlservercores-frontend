# 工作流名称
name: Deploy to GitHub Pages

# 触发条件：在 push 到 main 或 master 分支时触发
on:
  push:
    branches:
      - main
      - master

# 任务
jobs:
  deploy:
    # 运行环境：使用最新的 Ubuntu
    runs-on: ubuntu-latest

    # 步骤
    steps:
      # 第一步：检出代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 第二步：设置 Node.js 环境
      # 使用 LTS (长期支持) 版本的 Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # 您可以根据需要更改版本
          cache: 'npm'   # 缓存 npm 依赖，加快构建速度

      # 第三步：安装依赖
      # 使用 npm ci 更适合 CI 环境，它比 npm install 更快、更可靠
      - name: Install dependencies
        run: npm ci

      # 第四步：构建项目
      # 运行您在 package.json 中定义的 build 命令
      - name: Build project
        run: npm run build

      # 第五步：部署到 gh-pages 分支
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          # GITHUB_TOKEN 是由 GitHub Actions 自动提供的，用于授权
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # 指定要部署的构建输出文件夹，Vite 和 Parcel 默认都是 'dist'
          publish_dir: ./dist
          # 如果您想保留 CNAME 文件（用于自定义域名），可以取消下面这行的注释
          # keep_files: true
          # 如果您有自定义域名，请取消下面这行的注释并替换为您的域名
          # cname: your.custom.domain.com