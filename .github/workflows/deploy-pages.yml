# 工作流名称
name: Deploy to GitHub Pages

# 触发条件
on:
  push:
    branches:
      - main
      - master

# 并发控制
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# 为工作流授予权限
permissions:
  contents: write # 授予对仓库内容的写权限，这是部署 gh-pages 分支所必需的

# 任务
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 第 1 步：检出代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 第 2 步：设置 Node.js 环境
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 第 3 步：安装依赖
      - name: Install dependencies
        run: npm ci

      # 第 4 步：构建项目
      - name: Build project
        run: npm run build


      # 第 5 步：部署到 gh-pages 分支
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist