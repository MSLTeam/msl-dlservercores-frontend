<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="mc.serverCore.title">Minecraft 服务端核心下载 | MSLMC</title>
    <link rel="icon" type="image/svg+xml" href="https://www.mslmc.cn/favicon.ico" />
    <link href="https://jsdmirrors.aino.cyou/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://jsdmirrors.aino.cyou/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css">

    <link rel="stylesheet" href="css/style.css">
    <meta name="keywords" content="MSL, MSLFrp, 下载MC服务端,服务端,下载 ,开服器, Minecraft, Frp, 联机, Minecraft Server Launcher" />
    <meta name="description" content="欢迎使用MSL的服务端镜像下载服务！" />
    <script>
        (function() {
            const getStoredTheme = () => localStorage.getItem('theme');
            const getPreferredTheme = () => {
                const storedTheme = getStoredTheme();
                if (storedTheme) return storedTheme;
                return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            };
            document.documentElement.setAttribute('data-bs-theme', getPreferredTheme());
        })();
    </script>
</head>
<body class="dynamic-bg">

<header class="page-header py-5 border-bottom position-relative">
    <div class="container text-center">
        <div class="d-flex justify-content-center align-items-center gap-3 mb-3">
            <i class="fa-solid fa-cloud title-icon"></i>
            <h1 class="display-5 fw-bold" data-i18n="mc.serverCore.title"></h1>
        </div>
        <p class="fs-5 text-body-secondary" data-i18n="mc.serverCore.description"></p>
        <p class="small text-body-secondary mt-3" data-i18n="mc.serverCore.attribution"></p>

        <div class="d-flex justify-content-center align-items-center gap-2 mt-4">
            <div class="dropdown">
                <button class="btn btn-secondary btn-sm dropdown-toggle d-flex align-items-center" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                    <i class="fa-solid fa-globe me-1"></i>
                    <span id="language-display">Language</span>
                </button>
                <ul id="language-switcher" class="dropdown-menu">
                    <li><button class="dropdown-item" type="button" data-lang="zh-CN">简体中文</button></li>
                    <li><button class="dropdown-item" type="button" data-lang="zh-TW">繁體中文</button></li>
                    <li><button class="dropdown-item" type="button" data-lang="en-US">English</button></li>
                </ul>
            </div>

            <div class="dropdown">
                <button class="btn btn-secondary btn-sm dropdown-toggle d-flex align-items-center" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                    <i id="theme-icon-active" class="fa-solid fa-circle-half-stroke me-1"></i>
                    <span data-i18n="theme.switcher"></span>
                </button>
                <ul class="dropdown-menu">
                    <li><button class="dropdown-item d-flex align-items-center" type="button" data-theme-value="light"><i class="fa-solid fa-sun me-2"></i> <span data-i18n="theme.light"></span></button></li>
                    <li><button class="dropdown-item d-flex align-items-center" type="button" data-theme-value="dark"><i class="fa-solid fa-moon me-2"></i> <span data-i18n="theme.dark"></span></button></li>
                    <li><button class="dropdown-item d-flex align-items-center" type="button" data-theme-value="auto"><i class="fa-solid fa-circle-half-stroke me-2"></i> <span data-i18n="theme.auto"></span></button></li>
                </ul>
            </div>
        </div>
    </div>
</header>

<main class="container py-5 position-relative">
    <div class="row g-4">
        <div class="col-lg-4">
            <div class="section-header mb-4">
                <h2 class="fs-4 fw-semibold" data-i18n="mc.serverCore.categories"></h2>
                <p class="text-body-secondary" data-i18n="mc.serverCore.selectType"></p>
            </div>
            <div id="categories-grid" class="d-flex flex-column gap-3">
                <div class="text-center p-5"><div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div></div>
            </div>
        </div>
        <div class="col-lg-8">
            <div class="selection-section card shadow-sm">
                <div class="card-body p-4">
                    <div id="servers-panel" class="d-none">
                        <div class="panel-header d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
                            <h3 class="fs-5 fw-semibold mb-0" data-i18n="mc.serverCore.selectCore"></h3>
                            <div class="input-group" style="max-width: 250px;"><span class="input-group-text"><i class="fa-solid fa-search"></i></span><input type="text" id="search-keyword" class="form-control" data-i18n-placeholder="mc.serverCore.searchCore"></div>
                        </div>
                        <div id="servers-grid" class="row row-cols-1 row-cols-sm-2 row-cols-xl-3 g-3"></div>
                    </div>
                    <div id="versions-panel" class="d-none mt-4">
                        <div class="panel-header d-flex justify-content-between align-items-center mb-4">
                            <h3 id="version-card-title" class="fs-5 fw-semibold mb-0"></h3>
                            <button id="refresh-versions-btn" class="btn btn-sm btn-outline-primary d-flex align-items-center gap-1"><i class="fa-solid fa-arrows-rotate"></i><span data-i18n="mc.serverCore.refresh"></span></button>
                        </div>
                        <div id="versions-container"></div>
                    </div>
                    <div id="empty-state" class="text-center p-5">
                        <i class="fa-solid fa-cloud display-1 text-body-tertiary mb-3"></i>
                        <h3 class="fs-4 fw-semibold" data-i18n="mc.serverCore.startSelect"></h3>
                        <p class="text-body-secondary" data-i18n="mc.serverCore.selectCategoryFirst"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div class="modal fade" id="verificationModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header"><h1 class="modal-title fs-5" id="verificationModalLabel" data-i18n="mc.serverCore.fileVerification"></h1><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
            <div class="modal-body">
                <p><strong data-i18n="mc.serverCore.server"></strong>: <span id="modal-server-name"></span></p>
                <p><strong data-i18n="mc.serverCore.version"></strong>: <span id="modal-version-name"></span></p>
                <div class="mb-2"><strong>SHA256:</strong></div>
                <pre class="bg-body-tertiary p-2 rounded"><code><small id="modal-sha256"></small></code></pre>
            </div>
            <div class="modal-footer"><button type="button" class="btn btn-primary" data-bs-dismiss="modal" data-i18n="common.confirm"></button></div>
        </div>
    </div>
</div>
<div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="appToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="toast-header"><i id="toast-icon" class="fa-solid me-2"></i><strong id="toast-title" class="me-auto"></strong><button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button></div>
        <div id="toast-body" class="toast-body"></div>
    </div>
</div>

<footer class="py-4 mt-auto text-center position-relative">
    <div class="container">
        <p class="text-body-secondary small mb-1" data-i18n="footer.copyright"></p>
        <p class="text-body-secondary small mb-0">
            <a href="https://beian.miit.gov.cn/" target="_blank" class="text-reset text-decoration-none" data-i18n="footer.icp"></a>
        </p>
    </div>
</footer>

<script src="https://jsdmirrors.aino.cyou/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="lang/zh-CN.js"></script>
<script src="lang/zh-TW.js"></script>
<script src="lang/en-US.js"></script>
<script src="js/script.js"></script>
</body>
</html>
