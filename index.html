                    <span id=language-display>Language</span>
                </button>
                <ul id=language-switcher class=dropdown-menu>
                    <li><button class=dropdown-item type=button data-lang=zh-CN>简体中文</button></li>
                    <li><button class=dropdown-item type=button data-lang=zh-TW>繁體中文</button></li>
                    <li><button class=dropdown-item type=button data-lang=en-US>English</button></li>
                </ul>
            </div>

            <div class=dropdown>
                <button class="align-items-center btn btn-secondary btn-sm d-flex dropdown-toggle" type=button data-bs-toggle=dropdown aria-expanded=false>
                    <i id=theme-icon-active class="fa-circle-half-stroke fa-solid me-1"></i>

                <ul class=dropdown-menu>

<main class="container position-relative py-5">

        <div class=col-lg-4>

            </div>
        </div>
        <div class=col-lg-8>
            <div class="card selection-section shadow-sm">
                <div class="card-body p-4">
                    <div id=servers-panel class=d-none>
                        <div class="align-items-md-center d-flex flex-column flex-md-row gap-3 justify-content-between mb-4 panel-header">
                            <h3 class="fs-5 fw-semibold mb-0" data-i18n=mc.serverCore.selectCore></h3>
                            <div class=input-group style=max-width:250px><span class=input-group-text><i class="fa-search fa-solid"></i></span><input id=search-keyword class=form-control data-i18n-placeholder=mc.serverCore.searchCore></div>

                    <div id=empty-state class="p-5 text-center">
                        <i class="display-1 fa-cloud fa-solid mb-3 text-body-tertiary"></i>
                        <h3 class="fs-4 fw-semibold" data-i18n=mc.serverCore.startSelect></h3>
                        <p class=text-body-secondary data-i18n=mc.serverCore.selectCategoryFirst></p>
